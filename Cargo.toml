[workspace]
resolver = "2"
members = [
    "crates/rco-types",
    "crates/rco-bencode",
    "crates/rco-p14",
    "crates/rco-merkle",
    "crates/rco-entropy",
    "crates/rco-ingestion",
    "crates/rco-sdk-julia",
    "crates/rco-audit",
    "crates/rco-e2e",
    "crates/rco-crypto",
    "crates/rco-tpm",
    "crates/rco-quorum",
    "crates/rco-forensics",
    "crates/rco-hpb",
    "crates/rco-pq",
    "crates/rco-alignment",
    "crates/rco-enclave",
    "crates/rco-consensus",
    "crates/rco-synthesis",
    "crates/rco-threshold",
    "crates/rco-reflexive",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Mohit Ranjan <mohit@mrrg.io>"]
license = "LicenseRef-Proprietary"
repository = "https://github.com/mrrg/rco-protocol"

[workspace.dependencies]
# Cryptographic primitives
sha3 = { version = "0.10", default-features = false }
zeroize = { version = "1.8", features = ["derive"] }
subtle = { version = "2.6", default-features = false }
rand_core = { version = "0.6", default-features = false }
getrandom = { version = "0.3", default-features = false }

# Testing
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }

# Internal crates
rco-types = { path = "crates/rco-types" }
rco-bencode = { path = "crates/rco-bencode" }
rco-p14 = { path = "crates/rco-p14" }
rco-merkle = { path = "crates/rco-merkle" }
rco-entropy = { path = "crates/rco-entropy" }
rco-ingestion = { path = "crates/rco-ingestion" }
rco-sdk-julia = { path = "crates/rco-sdk-julia" }
rco-audit = { path = "crates/rco-audit" }
rco-crypto = { path = "crates/rco-crypto" }
rco-tpm = { path = "crates/rco-tpm" }
rco-quorum = { path = "crates/rco-quorum" }
rco-hpb = { path = "crates/rco-hpb" }
rco-pq = { path = "crates/rco-pq" }
rco-alignment = { path = "crates/rco-alignment" }
rco-forensics = { path = "crates/rco-forensics" }
rco-enclave = { path = "crates/rco-enclave" }
rco-consensus = { path = "crates/rco-consensus" }
tempfile = "3.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.build-override]
opt-level = 3

[profile.bench]
opt-level = 3
lto = "thin"
