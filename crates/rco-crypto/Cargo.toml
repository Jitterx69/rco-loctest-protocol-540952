[package]
name = "rco-crypto"
description = "RCO Protocol — BLS12-381 Threshold Signatures and DKG"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
rco-types = { workspace = true }
bls12_381 = "0.8"
rand = "0.8"
rand_core = "0.6"
sha2 = "0.10"
ff = "0.13"
group = "0.13"
zeroize = { version = "1.6", features = ["zeroize_derive"] }
