[package]
name = "rco-sdk-java"
description = "RCO Protocol — Java SDK (JNI Bindings)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
rco-p14 = { path = "../rco-p14" }
rco-types = { path = "../rco-types" }
rco-enclave = { path = "../rco-enclave" }
rco-quorum = { path = "../rco-quorum" }
group = "0.13"
bytemuck = { version = "1.15", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
